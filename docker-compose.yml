services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: expresscafe-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
    networks:
      - expresscafe-net

  nginx:
    image: nginx:1.25-alpine
    container_name: expresscafe-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - expresscafe-net

  mysql:
    image: mysql:8.0
    container_name: expresscafe-mysql
    restart: unless-stopped
    environment:
      
      MYSQL_USER: expressuser
      MYSQL_PASSWORD: expresspass
      MYSQL_ROOT_PASSWORD: rootpass
      TZ: America/Bogota
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - expresscafe-net

volumes:
  mysql_data:

networks:
  expresscafe-net:
